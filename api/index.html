<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production Solaire — SIDEC Jura</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --sun: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    header { text-align: center; margin-bottom: 2.5rem; }
    h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em; }
    .subtitle { color: var(--muted); margin-top: 0.4rem; font-size: 0.95rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 900px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .label {
      color: var(--muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.8rem;
    }
    .value { font-size: 2.8rem; font-weight: 800; color: var(--accent); }
    .card.instant .value { color: var(--sun); }
    .unit { font-size: 1.1rem; font-weight: 500; color: var(--muted); margin-left: 0.3rem; }
    footer { margin-top: 2rem; color: var(--muted); font-size: 0.85rem; text-align: center; }
    .error { color: #f87171; margin-top: 1rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Production Photovoltaïque — SIDEC</h1>
    <p class="subtitle">Suivi en direct de l'installation solaire</p>
  </header>

  <main class="grid">
    <div class="card instant">
      <div class="label">Puissance instantanée</div>
      <div class="value"><span id="power">--</span><span class="unit">kW</span></div>
    </div>
    <div class="card">
      <div class="label">Production du jour</div>
      <div class="value"><span id="day">--</span><span class="unit">kWh</span></div>
    </div>
    <div class="card">
      <div class="label">Production totale</div>
      <div class="value"><span id="total">--</span><span class="unit">MWh</span></div>
    </div>
  </main>

  <footer>
    <div id="status">Chargement des données...</div>
    <div id="error" class="error"></div>
  </footer>

  <script>
    async function refreshData() {
      const errorEl = document.getElementById('error');
      const statusEl = document.getElementById('status');
      errorEl.textContent = '';

      try {
        const res = await fetch('/api/production');
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Erreur de récupération');
        }

        document.getElementById('power').textContent =
          data.activePowerKw !== null ? data.activePowerKw.toLocaleString('fr-FR') : '--';
        document.getElementById('day').textContent =
          data.dayPowerKwh.toLocaleString('fr-FR');
        document.getElementById('total').textContent =
          (data.totalPowerKwh / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 2 });

        const date = new Date(data.updatedAt);
        statusEl.textContent = `Dernière mise à jour : ${date.toLocaleTimeString('fr-FR')}`;
      } catch (err) {
        errorEl.textContent = `Impossible d'actualiser : ${err.message}`;
      }
    }

    refreshData();
    setInterval(refreshData, 300000); // Rafraîchissement toutes les 5 minutes
  </script>
</body>
</html>
