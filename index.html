<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Solaire — SIDEC Jura</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    header { text-align: center; margin-bottom: 2.5rem; }
    h1 { font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; font-size: 1rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 900px;
    }
    .card {
      background-color: #162033;
      border: 1px solid #26334d;
      border-radius: 12px;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .card-title {
      color: #94a3b8;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }
    .card-value { font-size: clamp(2rem, 4vw, 2.8rem); font-weight: 700; }
    .unit { font-size: 1.1rem; font-weight: 500; color: #cbd5e1; margin-left: 0.3rem; }
    .power { color: #f59e0b; }
    .energy { color: #10b981; }
    footer { margin-top: 2.5rem; text-align: center; font-size: 0.9rem; color: #94a3b8; }
    .error { color: #ef4444; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <header>
    <h1>Production Photovoltaïque — SIDEC</h1>
    <p class="subtitle">Suivi en direct de l'installation solaire</p>
  </header>

  <main class="grid">
    <div class="card">
      <div class="card-title">Puissance instantanée</div>
      <div class="card-value"><span id="power" class="power">--</span><span class="unit">kW</span></div>
    </div>
    <div class="card">
      <div class="card-title">Production du jour</div>
      <div class="card-value"><span id="day" class="energy">--</span><span class="unit">kWh</span></div>
    </div>
    <div class="card">
      <div class="card-title">Production totale</div>
      <div class="card-value"><span id="total" class="energy">--</span><span class="unit">MWh</span></div>
    </div>
  </main>

  <footer>
    <p id="status">Chargement des données...</p>
    <p id="error" class="error"></p>
  </footer>

  <script>
    const CACHE_KEY = 'sidec_solar_last_data';

    function renderData(data, isCached = false) {
      document.getElementById('power').textContent =
        data.activePowerKw !== null ? data.activePowerKw.toLocaleString('fr-FR') : '--';
      document.getElementById('day').textContent =
        data.dayPowerKwh.toLocaleString('fr-FR');
      document.getElementById('total').textContent =
        (data.totalPowerKwh / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 2 });

      const date = new Date(data.updatedAt);
      const suffix = isCached ? ' (données mémorisées)' : '';
      document.getElementById('status').textContent =
        `Dernière mise à jour : ${date.toLocaleTimeString('fr-FR')}${suffix}`;
    }

    async function refreshData() {
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      const saved = localStorage.getItem(CACHE_KEY);
      if (saved) {
        try { renderData(JSON.parse(saved), true); } catch (e) {}
      }

      try {
        const res = await fetch('/api/production');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur de récupération');

        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        renderData(data, false);
      } catch (err) {
        if (!saved) {
          errorEl.textContent = `En attente des données FusionSolar (${err.message})`;
        }
      }
    }

    refreshData();
    setInterval(refreshData, 300000);
  </script>
</body>
</html>
